<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>QFC · Жеңілдік тексеру</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --text:#111111; --text-2:#6B6B6B; --text-3:#A3A3A3;
  --border:#E8E8E5; --accent:#D6173F; --ok:#12805C; --ok-bg:#EEF7F3; --bad:#C2253B; --bad-bg:#FCF0F2; --warn:#9A6B00; --warn-bg:#FBF5E6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
.wrap{max-width:460px;margin:0 auto;padding:20px 20px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.2px}
.brand svg{width:22px;height:22px}
.brand{min-width:0}
.brand span{color:var(--text-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.hbtns{display:flex;gap:6px}
.link{border:0;background:none;font:500 13px Inter;color:var(--text-2);padding:6px 8px;border-radius:8px;cursor:pointer}
.link:hover{background:#EFEFEC}
h1{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2}
.sub{color:var(--text-2);font-size:14px;margin:8px 0 28px}
label.f{display:block;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:8px}
.input{width:100%;height:60px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:0 18px;font:600 22px Inter;letter-spacing:.3px;color:var(--text);outline:none;transition:border-color .15s, box-shadow .15s;font-variant-numeric:tabular-nums}
.input.sm{height:52px;font-size:16px;font-weight:500;letter-spacing:0}
.input:focus{border-color:var(--text);box-shadow:0 0 0 4px rgba(17,17,17,.06)}
.btn{width:100%;height:56px;border:0;border-radius:12px;background:var(--text);color:#fff;font:600 16px Inter;cursor:pointer;margin-top:12px;transition:opacity .15s, transform .1s}
.btn:active{transform:scale(.99)}
.btn.accent{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
.btn[disabled]{opacity:.4;pointer-events:none}
.result{margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.status{display:flex;align-items:center;gap:12px;padding:20px 20px 18px}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 40px}
.dot svg{width:20px;height:20px}
.status b{display:block;font-size:18px;font-weight:700;letter-spacing:-.3px}
.status small{display:block;color:var(--text-2);font-size:13px;margin-top:2px}
.ok .dot{background:var(--ok-bg);color:var(--ok)} .ok .status b{color:var(--ok)}
.bad .dot{background:var(--bad-bg);color:var(--bad)} .bad .status b{color:var(--bad)}
.warn .dot{background:var(--warn-bg);color:var(--warn)} .warn .status b{color:var(--warn)}
.rows{border-top:1px solid var(--border);padding:6px 20px}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;font-size:14px;border-bottom:1px solid #F1F1EE}
.row:last-child{border-bottom:0}
.row span{color:var(--text-2)}
.row b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pin{letter-spacing:4px}
.foot{padding:4px 20px 20px}
.note{font-size:13px;color:var(--text-2);padding:14px 20px;border-top:1px solid var(--border);background:#FBFBFA}
.big{font-size:44px;font-weight:700;letter-spacing:-1.5px;color:var(--ok);padding:0 20px 4px;line-height:1}
.confirm{display:flex;gap:8px}
.confirm .btn{margin-top:12px}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--text);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><g id="qfc">
  <path d="M0 0H96A30 30 0 0 1 126 30V51H22A22 22 0 0 1 0 29Z" fill="#D6173F"/>
  <path d="M25 51H126V153A25 25 0 0 1 101 178H0V76A25 25 0 0 1 25 51Z" fill="#E9E2CB"/>
  <path d="M126 51H176L133 76Z" fill="#F9B92E"/><circle cx="90" cy="76" r="12" fill="#333"/>
  <path d="M126 76H151A25 25 0 0 1 176 101V178H151A25 25 0 0 1 126 153Z" fill="#D6173F"/></g></defs></svg>

<div class="wrap">
  <header>
    <div class="brand"><svg viewBox="0 0 176 178"><use href="#qfc"/></svg>QFC <span id="who"></span></div>
    <div class="hbtns"><button class="link" id="lang"></button><button class="link hide" id="out"></button></div>
  </header>

  <!-- login -->
  <section id="login" class="hide">
    <h1 data-t="lH"></h1>
    <p class="sub" data-t="lP"></p>
    <label class="f" data-t="lName"></label>
    <input class="input sm" id="cName" maxlength="40" autocomplete="name">
    <div style="height:14px"></div>
    <label class="f" data-t="lKey"></label>
    <input class="input sm" id="cKey" type="password" autocomplete="current-password">
    <button class="btn" id="lBtn" data-t="lBtn"></button>
  </section>

  <!-- check -->
  <section id="main" class="hide">
    <h1 data-t="mH"></h1>
    <p class="sub" data-t="mP"></p>
    <label class="f" data-t="phone"></label>
    <input class="input" id="ph" type="tel" inputmode="numeric" autocomplete="off" placeholder="+7 (7__) ___-__-__">
    <button class="btn" id="check" data-t="check"></button>
    <div id="res"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="phone.js"></script>
<script>
const CONFIG = window.QFC_CONFIG;
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
let L = ls.get('qfc_kassa_lang') || 'kk';
const T = o => o[L] ?? o.kk;
const I = {
  lH:{kk:"Кассаға кіру",ru:"Вход для кассира"}, lP:{kk:"Бір рет кіресіз — телефон есте сақтайды.",ru:"Войдите один раз — телефон запомнит."},
  lName:{kk:"Атыңыз және филиал",ru:"Ваше имя и филиал"}, lKey:{kk:"Кассир құпия сөзі",ru:"Пароль кассира"}, lBtn:{kk:"Кіру",ru:"Войти"},
  mH:{kk:"Жеңілдікті тексеру",ru:"Проверка скидки"},
  mP:{kk:"Клиент «менде 10% жеңілдік бар» десе — нөмірін сұрап, осында енгізіңіз.",ru:"Если клиент говорит «у меня скидка 10%» — спросите номер и введите здесь."},
  phone:{kk:"Клиенттің телефон нөмірі",ru:"Номер телефона клиента"}, check:{kk:"Тексеру",ru:"Проверить"},
  active:{kk:"Жеңілдік бар",ru:"Скидка есть"}, activeS:{kk:"Тапсырысқа 10% жеңілдік жасаңыз",ru:"Сделайте скидку 10% на заказ"},
  used:{kk:"Жеңілдік пайдаланылған",ru:"Скидка уже использована"}, usedS:{kk:"Бұл нөмір жеңілдікті алып қойған",ru:"По этому номеру скидка уже получена"},
  expired:{kk:"Мерзімі өтіп кеткен",ru:"Срок действия истёк"}, expiredS:{kk:"Жеңілдік 30 күн ғана жарамды",ru:"Скидка действует только 30 дней"},
  none:{kk:"Жеңілдік жоқ",ru:"Скидки нет"}, noneS:{kk:"Бұл нөмір сауалнамадан өтпеген",ru:"Этот номер не проходил опрос"},
  partial:{kk:"Клиент сауалнаманы бастаған, бірақ соңына дейін өтпеген. Жеңілдік алу үшін аяқтауы керек.",ru:"Клиент начал опрос, но не завершил. Для скидки нужно пройти до конца."},
  name:{kk:"Аты",ru:"Имя"}, ph:{kk:"Телефон",ru:"Телефон"}, until:{kk:"Жарамды",ru:"Действует до"}, pin:{kk:"Тексеру коды",ru:"Код проверки"},
  usedAt:{kk:"Пайдаланған",ru:"Использована"}, usedBy:{kk:"Кім берді",ru:"Кто применил"},
  pinNote:{kk:"Күмән болса, клиенттен телефонындағы тексеру кодын сұраңыз.",ru:"Если сомневаетесь — попросите клиента показать код проверки на телефоне."},
  give:{kk:"Жеңілдік берілді деп белгілеу",ru:"Отметить: скидка применена"}, sure:{kk:"Растау",ru:"Подтвердить"}, cancel:{kk:"Болдырмау",ru:"Отмена"},
  done:{kk:"Белгіленді ✓",ru:"Отмечено ✓"}, newc:{kk:"Келесі клиент",ru:"Следующий клиент"},
  out:{kk:"Шығу",ru:"Выйти"}, bad:{kk:"Құпия сөз қате",ru:"Неверный пароль"}, err:{kk:"Байланыс қатесі, қайталап көріңіз",ru:"Ошибка связи, попробуйте снова"},
  short:{kk:"Нөмірді толық енгізіңіз",ru:"Введите номер полностью"}, fill:{kk:"Аты мен құпия сөзді толтырыңыз",ru:"Заполните имя и пароль"},
  noapi:{kk:"Сайт Google Sheets-ке қосылмаған (config.js). Әкімшіге хабарласыңыз.",ru:"Сайт не подключён к Google Sheets (config.js). Обратитесь к администратору."}
};
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtPhone = v => QFCPhone.pretty(v);
const fmtDate = (v,t) => { if(!v) return '—'; const d=new Date(v); if(isNaN(d)) return '—'; const p=n=>String(n).padStart(2,'0'); return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+(t?', '+p(d.getHours())+':'+p(d.getMinutes()):''); };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }
const ico = {
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
};

/* ---------- API ---------- */
async function api(p){
  const u = CONFIG.endpoint + (CONFIG.endpoint.includes('?')?'&':'?') + new URLSearchParams(Object.assign({key:ls.get('qfc_kassa_key')||''}, p));
  return (await fetch(u)).json();
}

/* ---------- check ---------- */
const ph = $('#ph');
const mask = QFCPhone.attach(ph);
ph.addEventListener('keydown', e=>{ if(e.key==='Enter') $('#check').click(); });

$('#check').onclick = async () => {
  if(!CONFIG.endpoint) return toast(T(I.noapi));
  const phone = QFCPhone.full(ph.value);
  if(!phone) return toast(T(I.short));
  const b=$('#check'); b.disabled=true;
  try{
    const r = await api({action:'lookup', phone});
    if(r.ok===false && r.error==='unauthorized'){ ls.del('qfc_kassa_key'); toast(T(I.bad)); return showLogin(); }
    render(r, phone);
  }catch(e){ toast(T(I.err)); }
  finally{ b.disabled=false; }
};

function render(r, phone){
  const rows = (arr) => `<div class="rows">${arr.filter(Boolean).map(([k,v,c])=>`<div class="row"><span>${k}</span><b class="${c||''}">${v}</b></div>`).join('')}</div>`;
  let h;
  if(!r.found){
    h = `<div class="result ${r.partial?'warn':'bad'}"><div class="status"><div class="dot">${ico.x}</div><div><b>${T(I.none)}</b><small>${T(I.noneS)}</small></div></div>
      ${r.partial?`<div class="note">${T(I.partial)}</div>`:''}</div>`;
  } else if(r.state==='active'){
    h = `<div class="result ok"><div class="status"><div class="dot">${ico.ok}</div><div><b>${T(I.active)}</b><small>${T(I.activeS)}</small></div></div>
      <div class="big">−${CONFIG.discount}%</div>
      ${rows([[T(I.name),esc(r.name)],[T(I.ph),fmtPhone(r.phone)],[T(I.until),fmtDate(r.expires)],r.pin&&[T(I.pin),esc(r.pin),'pin']])}
      <div class="note">${T(I.pinNote)}</div>
      <div class="foot" id="act"><button class="btn accent" id="give">${T(I.give)}</button></div></div>`;
  } else if(r.state==='used'){
    h = `<div class="result bad"><div class="status"><div class="dot">${ico.x}</div><div><b>${T(I.used)}</b><small>${T(I.usedS)}</small></div></div>
      ${rows([[T(I.name),esc(r.name)],[T(I.ph),fmtPhone(r.phone)],[T(I.usedAt),fmtDate(r.used_at,true)],r.used_by&&[T(I.usedBy),esc(r.used_by)]])}</div>`;
  } else {
    h = `<div class="result warn"><div class="status"><div class="dot">${ico.clock}</div><div><b>${T(I.expired)}</b><small>${T(I.expiredS)}</small></div></div>
      ${rows([[T(I.name),esc(r.name)],[T(I.ph),fmtPhone(r.phone)],[T(I.until),fmtDate(r.expires)]])}</div>`;
  }
  $('#res').innerHTML = h;
  const g=$('#give'); if(g) g.onclick = () => {
    $('#act').innerHTML = `<div class="confirm"><button class="btn ghost" id="no">${T(I.cancel)}</button><button class="btn accent" id="yes">${T(I.sure)}</button></div>`;
    $('#no').onclick = () => render(r, phone);
    $('#yes').onclick = async () => {
      $('#yes').disabled=true;
      try{
        const res = await api({action:'redeem', phone, by: ls.get('qfc_kassa_name')||''});
        toast(res.ok ? T(I.done) : res.error);
        const fresh = await api({action:'lookup', phone}); render(fresh, phone);
        $('#res .result').insertAdjacentHTML('beforeend', `<div class="foot"><button class="btn ghost" id="nextc">${T(I.newc)}</button></div>`);
        $('#nextc').onclick = () => { $('#res').innerHTML=''; mask.clear(); ph.focus(); };
      }catch(e){ toast(T(I.err)); render(r, phone); }
    };
  };
}

/* ---------- shell ---------- */
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T(I[el.dataset.t]));
  $('#lang').textContent = L==='kk'?'РУС':'ҚАЗ'; $('#out').textContent=T(I.out);
}
function showLogin(){ $('#main').classList.add('hide'); $('#out').classList.add('hide'); $('#login').classList.remove('hide'); $('#who').textContent=''; $('#cName').value=ls.get('qfc_kassa_name')||''; }
function showMain(){ $('#login').classList.add('hide'); $('#main').classList.remove('hide'); $('#out').classList.remove('hide');
  $('#who').textContent = ls.get('qfc_kassa_name') ? '· '+ls.get('qfc_kassa_name') : ''; }
$('#lBtn').onclick = () => {
  const n=$('#cName').value.trim(), k=$('#cKey').value.trim();
  if(!n || !k) return toast(T(I.fill));
  ls.set('qfc_kassa_name', n); ls.set('qfc_kassa_key', k);
  // құпия сөзді бірден тексереміз
  const btn=$('#lBtn'); btn.disabled=true;
  api({action:'lookup', phone:'70000000000'}).then(r=>{
    if(r && r.ok===false && r.error==='unauthorized'){ ls.del('qfc_kassa_key'); toast(T(I.bad)); }
    else showMain();
  }).catch(()=>toast(T(I.err))).finally(()=>{ btn.disabled=false; });
};
$('#cKey').onkeydown = e => { if(e.key==='Enter') $('#lBtn').click(); };
$('#out').onclick = () => { ls.del('qfc_kassa_key'); $('#res').innerHTML=''; showLogin(); };
$('#lang').onclick = () => { L=L==='kk'?'ru':'kk'; ls.set('qfc_kassa_lang',L); applyLang(); $('#res').innerHTML=''; };
applyLang();
(ls.get('qfc_kassa_name') && ls.get('qfc_kassa_key')) ? showMain() : showLogin();
</script>
</body>
</html>
